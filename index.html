  <h1 class="text-2xl font-bold tracking-wide">ዞላንቺ ሊቤሎ</h1>
  <p class="text-xs tracking-[0.3em] text-[#a8862a] mt-1">ZOLANCHI LIBELO</p>
</header>

<main id="cards" class="px-3 max-w-md mx-auto space-y-4"></main>

<footer class="fixed bottom-0 inset-x-0 bg-[#14141a]/95 backdrop-blur border-t border-[#d4af37]/40 px-4 pt-3" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)">
  <div class="max-w-md mx-auto">
    <div class="flex items-end justify-between">
      <span class="text-sm text-[#a8862a]">ጠቅላላ ሊትር</span>
      <span id="total" class="text-3xl font-extrabold text-[#f5d76e]">0</span>
    </div>
    <div class="flex gap-2 mt-2">
      <button onclick="shareAll()" class="flex-1 gold-grad text-black font-bold rounded-xl py-2.5 active:scale-95">አጋራ</button>
      <button onclick="resetAll()" class="flex-1 border border-[#d4af37]/60 rounded-xl py-2.5 active:scale-95">አጽዳ</button>
    </div>
  </div>
</footer>

<script>
  const N = 4, KEY = "liter_pro_v1";
  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  let data = {};
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}

  function field(i, k, label, ph) {
    return `<label class="block text-xs text-[#a8862a]">${label}
      <input id="t${i}${k}" type="number" step="any" inputmode="decimal" placeholder="${ph}"
        value="${data["t" + i + k] ?? ""}" oninput="calc(${i})"
        class="mt-1 w-full rounded-lg px-3 py-2.5 text-lg"></label>`;
  }

  $("cards").innerHTML = Array.from({ length: N }, (_, i) => `
    <section class="rounded-2xl bg-[#14141a] border border-[#d4af37]/30 p-4 shadow-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">ታንከር ${i + 1}</h2>
        <button onclick="swap(${i})" class="text-xs border border-[#d4af37]/50 rounded-full px-3 py-1 active:scale-95">ቀይር ⇅</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${field(i, "x0", "ዝቅተኛ ደረጃ (X0)", "0")}
        ${field(i, "y0", "ዝቅተኛ ሊትር (Y0)", "0")}
        ${field(i, "x", "የተለካ ደረጃ (X)", "0")}
        <div>
          <div class="text-xs text-[#a8862a]">ውጤት ሊትር (Y)</div>
          <div id="r${i}" class="mt-1 rounded-lg px-3 py-2.5 text-lg font-extrabold text-[#f5d76e] bg-[#d4af37]/10 border border-[#d4af37]/60">—</div>
        </div>
        ${field(i, "x1", "ከፍተኛ ደረጃ (X1)", "0")}
        ${field(i, "y1", "ከፍተኛ ሊትር (Y1)", "0")}
      </div>
      <p id="e${i}" class="text-red-400 text-xs mt-2 min-h-[1rem]"></p>
    </section>`).join("");

  const results = Array(N).fill(null);

  function calc(i) {
    const ks = ["x0", "y0", "x", "x1", "y1"], v = {};
    ks.forEach(k => { data["t" + i + k] = $("t" + i + k).value; });
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
    results[i] = null; $("r" + i).textContent = "—"; $("e" + i).textContent = "";
    if (ks.some(k => data["t" + i + k] === "")) return update();
    ks.forEach(k => v[k] = parseFloat(data["t" + i + k]));
    if (v.x1 === v.x0) { $("e" + i).textContent = "X0 እና X1 እኩል መሆን የለባቸውም"; return update(); }
    const lo = Math.min(v.x0, v.x1), hi = Math.max(v.x0, v.x1);
    if (v.x < lo || v.x > hi) { $("e" + i).textContent = "የተለካው ደረጃ በሁለቱ ደረጃዎች መካከል መሆን አለበት"; return update(); }
    // y = y0 + (x - x0) * (y1 - y0) / (x1 - x0)
    const y = v.y0 + (v.x - v.x0) * (v.y1 - v.y0) / (v.x1 - v.x0);
    results[i] = y; $("r" + i).textContent = fmt(y);
    update();
  }

  function update() {
    $("total").textContent = fmt(results.reduce((a, b) => a + (b || 0), 0));
  }

  function swap(i) {
    ["", ""].length;
    [["x0", "x1"], ["y0", "y1"]].forEach(([a, b]) => {
      const A = $("t" + i + a), B = $("t" + i + b);
      [A.value, B.value] = [B.value, A.value];
    });
    calc(i);
  }

  function resetAll() {
    if (!confirm("ሁሉንም ለማጽዳት እርግጠኛ ነዎት?")) return;
    data = {};
    try { localStorage.removeItem(KEY); } catch (e) {}
    document.querySelectorAll("input").forEach(el => el.value = "");
    for (let i = 0; i < N; i++) calc(i);
  }

  function shareAll() {
    const lines = results.map((r, i) => r === null ? null : `ታንከር ${i + 1}: ${fmt(r)} ሊትር`).filter(Boolean);
    if (!lines.length) return alert("መጀመሪያ ያስሉ");
    const text = "ዞላንቺ ሊቤሎ\n" + lines.join("\n") + "\nጠቅላላ: " + $("total").textContent + " ሊትር";
    if (navigator.share) navigator.share({ text }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert("ተቀድቷል"));
  }

  for (let i = 0; i < N; i++) calc(i);
</script>
